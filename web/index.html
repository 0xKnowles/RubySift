<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RubySift</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>RubySift</h1>
  <span class="tag">Ruby companion analyzer</span>
</header>

<section id="gate" class="panel">
  <h2>Open a log</h2>
  <p class="hint">The decryption key is held in memory only for this session and is never written to disk.</p>
  <form id="open-form">
    <label>.pclog file path
      <input type="text" id="path" placeholder="/path/to/20260717.pclog" required />
    </label>
    <label>Device key (Settings &rarr; Reveal log key, 64 hex chars)
      <input type="password" id="secret" placeholder="master key" required />
    </label>
    <button type="submit">Decrypt &amp; Load</button>
  </form>
  <p id="gate-error" class="error"></p>
</section>

<main id="dashboard" hidden>
  <section class="panel">
    <h2>Pulse Grid <span class="hint">ambient RF density by hour</span></h2>
    <div id="pulse-grid"></div>
  </section>

  <section class="panel">
    <h2>Signal Proximity <span class="hint">clustered by average RSSI</span></h2>
    <canvas id="proximity-canvas" width="640" height="360"></canvas>
  </section>

  <section class="panel">
    <h2>Nodes</h2>
    <table id="node-table">
      <thead><tr><th>MAC</th><th>Type</th><th>Label</th><th>Sightings</th><th>Avg RSSI</th><th>Max RSSI</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <button id="close-session">Close session</button>
</main>

<script src="/app.js"></script>
</body>
</html>
